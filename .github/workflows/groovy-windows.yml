# Builds Groovy OpenMW for Windows x64.
#
# Every successful build replaces its zip in the "latest" release, so these links always have the
# newest builds (no GitHub sign-in needed):
# master (regular OpenMW): https://github.com/zander2k01/groovy-openmw/releases/download/latest/groovy-openmw-windows-x64.zip
# xbox (Xbox UI version):  https://github.com/zander2k01/groovy-openmw/releases/download/latest/groovy-openmw-xbox-windows-x64.zip
#
# Based on OpenMW's own windows.yml (same prebuilt dependencies), without tests, OpenMW-CS and the
# debug symbol uploads.

name: Groovy Windows build

on:
  push:
    branches: [xbox]
  workflow_dispatch:

permissions:
  contents: write  # to update the "latest" release

concurrency:
  group: groovy-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  MSVC: "2022"
  ASSET: groovy-openmw-xbox-windows-x64.zip

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
    - uses: actions/checkout@v6

    - shell: bash
      name: Add deps version env to GITHUB_ENV, stripping comments
      run: |
        sed '/^\s*#/d; /^\s*$/d' "${{ github.workspace }}/CI/deps_versions.msvc.sh" >> $GITHUB_ENV

    - name: Create directories for dependencies
      run: |
        mkdir -p ${{ github.workspace }}/deps
        mkdir -p ${{ github.workspace }}/deps/Qt

    - name: Download prebuilt vcpkg packages
      working-directory: ${{ github.workspace }}/deps
      run: |
        $MANIFEST = "vcpkg-x64-windows-${{ env.MSVC }}-${{ env.VCPKG_TAG }}-manifest.txt"
        curl --fail --retry 3 -L -o "$MANIFEST" "https://gitlab.com/OpenMW/openmw-deps/-/raw/main/windows/$MANIFEST"
        $lines = Get-Content "$MANIFEST"
        $URL = $lines[0]
        $split = -split $lines[1]
        $HASH = $split[0]
        $FILE = $split[1]
        curl --fail --retry 3 -L -o "$FILE" "$URL"
        $filehash = Get-FileHash "$FILE" -Algorithm SHA512
        if ( $filehash.hash -ne "$HASH" ) {
          exit 1
        }
        echo "archive=$FILE" >> $env:GITHUB_ENV

    - name: Extract archived prebuilt vcpkg packages
      working-directory: ${{ github.workspace }}/deps
      run: 7z x -y -ovcpkg-x64-windows-${{ env.MSVC }}-${{ env.VCPKG_TAG }} $env:archive

    - name: Cache Qt
      id: qt-cache
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/deps/Qt/${{ env.QT_VER }}/msvc2019_64
        key: qt-cache-${{ env.QT_VER }}-msvc2019_64-v1

    - name: Download aqt
      if: steps.qt-cache.outputs.cache-hit != 'true'
      working-directory: ${{ github.workspace }}/deps/Qt
      run: >
        curl --fail --retry 3 -L
        -o aqt_x64.exe
        https://github.com/miurahr/aqtinstall/releases/download/v3.1.15/aqt_x64.exe

    - name: Install Qt with aqt
      if: steps.qt-cache.outputs.cache-hit != 'true'
      working-directory: ${{ github.workspace }}/deps/Qt
      run: .\aqt_x64.exe install-qt windows desktop ${{ env.QT_VER }} win64_msvc2019_64

    - uses: ilammy/msvc-dev-cmd@v1

    - uses: seanmiddleditch/gha-setup-ninja@master

    - name: Configure OpenMW
      run: >
        cmake
        -S .
        -B ${{ github.workspace }}/build
        -G Ninja
        -D CMAKE_BUILD_TYPE=Release
        -D CMAKE_TOOLCHAIN_FILE='${{ github.workspace }}/deps/vcpkg-x64-windows-${{ env.MSVC }}-${{ env.VCPKG_TAG }}/scripts/buildsystems/vcpkg.cmake'
        -D CMAKE_PREFIX_PATH='${{ github.workspace }}/deps/Qt/${{ env.QT_VER }}/msvc2019_64'
        -D LuaJit_INCLUDE_DIR='${{ github.workspace }}/deps/vcpkg-x64-windows-${{ env.MSVC }}-${{ env.VCPKG_TAG }}/installed/x64-windows/include/luajit'
        -D LuaJit_LIBRARY='${{ github.workspace }}/deps/vcpkg-x64-windows-${{ env.MSVC }}-${{ env.VCPKG_TAG }}/installed/x64-windows/lib/lua51.lib'
        -D BUILD_OPENCS=OFF
        -D BUILD_BENCHMARKS=OFF
        -D BUILD_COMPONENTS_TESTS=OFF
        -D BUILD_OPENMW_TESTS=OFF
        -D BUILD_OPENCS_TESTS=OFF
        -D OPENMW_USE_SYSTEM_SQLITE3=OFF
        -D OPENMW_USE_SYSTEM_YAML_CPP=OFF
        -D OPENMW_LTO_BUILD=ON

    - name: Build OpenMW
      shell: pwsh
      run: |
        cmake --build ${{ github.workspace }}/build 2>&1 | Tee-Object -FilePath build-output.txt
        $code = $LASTEXITCODE
        if ($code -ne 0) {
          # Show compiler/linker errors as annotations, so they appear on the commit.
          Select-String -Path build-output.txt -Pattern ' error |FAILED:|fatal error' |
            Select-Object -First 30 |
            ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
          exit $code
        }

    - name: Copy missing DLLs
      run: |
        cp ${{ github.workspace }}/deps/vcpkg-x64-windows-${{ env.MSVC }}-${{ env.VCPKG_TAG }}/installed/x64-windows/bin/Release/MyGUIEngine.dll ${{ github.workspace }}/build
        cp -Filter *.dll -Recurse ${{ github.workspace }}/deps/vcpkg-x64-windows-${{ env.MSVC }}-${{ env.VCPKG_TAG }}/installed/x64-windows/bin/osgPlugins-3.6.5 ${{ github.workspace }}/build
        cp ${{ github.workspace }}/deps/vcpkg-x64-windows-${{ env.MSVC }}-${{ env.VCPKG_TAG }}/installed/x64-windows/bin/*.dll ${{ github.workspace }}/build

    - name: Copy Qt DLLs
      working-directory: ${{ github.workspace }}/deps/Qt/${{ env.QT_VER }}/msvc2019_64
      run: |
        cp bin/Qt6Core.dll ${{ github.workspace }}/build
        cp bin/Qt6Gui.dll ${{ github.workspace }}/build
        cp bin/Qt6Network.dll ${{ github.workspace }}/build
        cp bin/Qt6OpenGL.dll ${{ github.workspace }}/build
        cp bin/Qt6OpenGLWidgets.dll ${{ github.workspace }}/build
        cp bin/Qt6Widgets.dll ${{ github.workspace }}/build
        cp bin/Qt6Svg.dll ${{ github.workspace }}/build
        mkdir ${{ github.workspace }}/build/styles
        cp plugins/styles/qwindowsvistastyle.dll ${{ github.workspace }}/build/styles
        mkdir ${{ github.workspace }}/build/platforms
        cp plugins/platforms/qwindows.dll ${{ github.workspace }}/build/platforms
        mkdir ${{ github.workspace }}/build/imageformats
        cp plugins/imageformats/qsvg.dll ${{ github.workspace }}/build/imageformats
        mkdir ${{ github.workspace }}/build/iconengines
        cp plugins/iconengines/qsvgicon.dll ${{ github.workspace }}/build/iconengines

    - name: Install OpenMW
      run: cmake --install ${{ github.workspace }}/build --prefix ${{ github.workspace }}/install

    - name: Clean up and add notes
      shell: bash
      run: |
        rm -rf install/bin install/_deps
        find install -name '*.pdb' -delete
        cat > install/README-GROOVY.txt <<EOF
        Groovy OpenMW (Xbox UI version)
        Commit: ${GITHUB_SHA}

        OpenMW with Groovy MiSTer output: plays Morrowind on a CRT through a MiSTer FPGA running
        the Groovy core, with very low lag.

        1. Run openmw-launcher.exe once and point it at your Morrowind installation, like normal OpenMW.
        2. In the launcher, go to Settings > Groovy MiSTer: tick Enable MiSTer Output, enter your
           MiSTer's IP address and pick a video mode (480i for CRT TVs).
        3. In the Groovy core's menu on the MiSTer, turn Audio on (it's off by default). For
           controllers plugged into the MiSTer, also set Server > Joysticks to Analog.
        4. Start the Groovy core on the MiSTer, then start OpenMW.

        Sound goes to the MiSTer and also plays on the PC. Controllers plugged into the MiSTer show
        up as "MiSTer Controller 1/2". See https://github.com/zander2k01/groovy-openmw for more.
        EOF

    - name: Store the build
      uses: actions/upload-artifact@v6
      with:
        name: groovy-openmw-xbox-windows-x64
        path: ${{ github.workspace }}/install/*
        if-no-files-found: error
        retention-days: 30

    - name: Zip
      shell: pwsh
      run: |
        Compress-Archive -Path "install/*" -DestinationPath $env:ASSET -Force
        Get-Item $env:ASSET | Format-Table Name, Length

    - name: Update the "latest" release
      if: github.ref == 'refs/heads/xbox'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # One release holds both builds: each branch only replaces its own zip.
        if ! gh release view latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          gh release create latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Latest builds" --latest \
            --notes "Newest Windows builds of Groovy OpenMW. groovy-openmw-windows-x64.zip: regular OpenMW. groovy-openmw-xbox-windows-x64.zip: OpenMW with the Xbox UI. Unzip anywhere, see README-GROOVY.txt."
        fi
        gh release upload latest "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
